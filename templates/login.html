<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.G. Lira's — Login</title>

<link rel="stylesheet" href="/static/css/login.css">
</head>

<body>
  <main class="box">
    <div class="logo">
      <span class="l1">S.G. </span><span class="l2">Lira's</span>
    </div>

    <div class="logo-line"></div>

    <div class="welcome">Bem-vindo de volta!</div>
    <div class="sub">Faça login para continuar</div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="usr">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5.5 20c.7-3.5 2.9-5.2 6.5-5.2s5.8 1.7 6.5 5.2"></path>
          </svg>
          Usuário
        </label>
        <input id="usr" type="text" placeholder="seu.usuario" autocomplete="username">
      </div>

      <div class="field">
        <label for="pwd">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2"></rect>
            <path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path>
          </svg>
          Senha
        </label>

        <div class="password-wrap">
          <input id="pwd" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar senha" title="Mostrar senha">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginButton">
        <span id="buttonText">Entrar</span>
        <span class="arrow">→</span>
      </button>

      <div class="erro" id="erro" role="alert"></div>
    </form>

    <div class="footer">
      <span class="footer-lock">♙</span>
      <span>Acesso restrito • S.G. Lira's</span>
    </div>
  </main>

<script src="/static/js/login.js"></script>
</body>
</html>
